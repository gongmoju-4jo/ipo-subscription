server:
  port: 8081
  tomcat:
    # Tomcat 스레드 지표(tomcat_threads_busy 등)를 내보내려면 필요하다
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 서비스별 응답 시간의 p95, p99를 Prometheus에서 계산할 수 있도록 구간(histogram)을 함께 내보낸다
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: account-service
  config:
    # 레포 루트의 .env를 읽는다 (docker-compose와 같은 파일). 실행 위치가 루트면 ./.env, 모듈이면 ../.env. 없으면 건너뛴다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # database ipo 하나에 서비스별 스키마 (account). 다른 서비스 스키마는 직접 조회하지 않는다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipo}?currentSchema=account
    # 서비스별 전용 계정 (init.sh가 만든다). 자기 스키마만 쓸 수 있다
    username: account_app
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.default_schema: account
      # 스키마는 init.sh가 만든다 (같은 이름). 서비스 계정은 DB CREATE 권한이 없어서 이 설정은 동작하지 않아도 된다
      hibernate.hbm2ddl.create_namespaces: true
    # schema.sql을 Hibernate가 테이블을 만든 뒤에 실행한다
    defer-datasource-initialization: true
  sql:
    init:
      # CHECK 제약, 부분 인덱스 (schema.sql). H2 테스트는 부분 인덱스를 지원하지 않아 never로 끈다
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # 이벤트 명세 공통 규칙: acks=all, enable.idempotence=true
      acks: all
      properties:
        enable.idempotence: true
        # Kafka가 죽었을 때 send()가 메타데이터를 기다리며 막히는 시간 (기본 60초). 발행 행마다 막히지 않게 send-timeout과 맞춘다
        max.block.ms: 5000
        # Producer가 포기하는 시간(delivery.timeout.ms)을 발행기의 send-timeout 이하로 맞춘다. 발행기가 실패로 처리한 뒤에도 Producer가 재시도해서 중복이 쌓이지 않게 한다
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      # group-id는 리스너마다 Consumer 이름으로 직접 지정한다 (이벤트 명세 3-2)
      # 그룹이 처음 생길 때 이미 쌓인 인출 요청을 놓치지 않도록 처음부터 읽는다
      auto-offset-reset: earliest
      # 처리가 끝난 레코드만 커밋한다 (리스너 ack-mode: record)
      enable-auto-commit: false
    listener:
      ack-mode: record
      # 토픽 파티션 수(docker/kafka/create-topics.sh 기본값 6)와 같은 수. 파티션보다 많으면 남는 Consumer는 일하지 않는다
      concurrency: 6

# 증거금 정산 Consumer (allocation.result) 배치 리스너 (#114)
margin:
  settle:
    # 1번 수신, 트랜잭션 1개, 커밋 1번에 처리하는 최대 메시지 수 (리스너의 max.poll.records)
    # 클수록 커밋 횟수가 감소하지만, 같은 배치의 계좌 행 잠금 보유 시간과 실패 시 1건씩 재처리하는 건수가 증가한다
    batch-size: ${MARGIN_SETTLE_BATCH_SIZE:100}

# Outbox 발행기 (서비스 3개가 같은 키)
outbox:
  publisher:
    # false면 스케줄 실행을 끈다
    enabled: true
    # 이전 실행이 끝난 뒤 다시 실행하기까지 쉬는 시간 (ISO-8601, @Scheduled가 읽는다)
    interval: PT1S
    batch-size: 100
    # 이 횟수 이상 연속 실패하면 알림 로그. Consumer 재시도(3회)와 별개이고, 넘어도 발행은 계속 시도한다
    alert-threshold: 5
    send-timeout: 5s

# 원장 대사 (#132). 계좌 잔고, 증거금, 원장 일치 여부를 조회만 하고, 불일치는 ERROR 로그로 기록한다
ledger:
  reconciliation:
    # false면 스케줄 실행을 비활성화한다
    enabled: true
    # 실행 시각 (KST, 초 분 시 일 월 요일). 기본 새벽 4시 하루 1회. 측정, 시연 때는 .env의 LEDGER_RECONCILIATION_CRON으로 변경 (예: 매분 "0 * * * * *")
    cron: ${LEDGER_RECONCILIATION_CRON:0 0 4 * * *}

logging:
  level:
    # 운영 기본 INFO. 로컬에서 처리 단계를 보려면 .env에 ACCOUNT_LOG_LEVEL=DEBUG
    com.gongmoju.account: ${ACCOUNT_LOG_LEVEL:INFO}

jwt:
  # 서명 키. .env의 JWT_SECRET (api-gateway와 같은 값). 비어 있으면 기동할 때 실패한다
  secret: ${JWT_SECRET:}
  # api-gateway가 이 값으로 검증한다
  issuer: account-service
  # 로그인 응답의 expiresIn과 같은 값 (초)
  expires-in-seconds: 3600

# 첫 관리자 시드 (AdminSeedRunner). 기동할 때 이 로그인 ID의 계정이 없으면 ADMIN으로 만든다
# 둘 다 비우면 건너뛰고, 하나만 있거나 형식(회원가입과 같은 규칙)이 틀리면 기동할 때 실패한다
admin-seed:
  login-id: ${ADMIN_LOGIN_ID:}
  # 비밀번호 원문. 출력하거나 로그에 남기지 않는다
  password: ${ADMIN_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
