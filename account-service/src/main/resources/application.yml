server:
  port: 8081

spring:
  application:
    name: account-service
  config:
    # 레포 루트의 .env를 읽는다 (docker-compose와 같은 파일). 실행 위치가 루트면 ./.env, 모듈이면 ../.env. 없으면 건너뛴다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # database ipo 하나에 서비스별 스키마 (account). 다른 서비스 스키마는 직접 조회하지 않는다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipo}?currentSchema=account
    # 서비스별 전용 계정 (init.sh가 만든다). 자기 스키마만 쓸 수 있다
    username: account_app
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.default_schema: account
      # 스키마는 init.sh가 만든다 (같은 이름). 서비스 계정은 DB CREATE 권한이 없어서 이 설정은 동작하지 않아도 된다
      hibernate.hbm2ddl.create_namespaces: true
    # schema.sql을 Hibernate가 테이블을 만든 뒤에 실행한다
    defer-datasource-initialization: true
  sql:
    init:
      # CHECK 제약, 부분 인덱스 (schema.sql). H2 테스트는 부분 인덱스를 지원하지 않아 never로 끈다
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # 이벤트 명세 공통 규칙: acks=all, enable.idempotence=true
      acks: all
      properties:
        enable.idempotence: true
        # Kafka가 죽었을 때 send()가 메타데이터를 기다리며 막히는 시간 (기본 60초). 발행 행마다 막히지 않게 send-timeout과 맞춘다
        max.block.ms: 5000

# Outbox 발행기 (서비스 3개가 같은 키)
outbox:
  publisher:
    # false면 스케줄 실행을 끈다
    enabled: true
    # 이전 실행이 끝난 뒤 다시 실행하기까지 쉬는 시간 (ISO-8601, @Scheduled가 읽는다)
    interval: PT1S
    batch-size: 100
    # 이 횟수 이상 연속 실패하면 알림 로그. Consumer 재시도(3회)와 별개이고, 넘어도 발행은 계속 시도한다
    alert-threshold: 5
    send-timeout: 5s

jwt:
  # 서명 키. .env의 JWT_SECRET (api-gateway와 같은 값). 비어 있으면 기동할 때 실패한다
  secret: ${JWT_SECRET:}
  # api-gateway가 이 값으로 검증한다
  issuer: account-service
  # 로그인 응답의 expiresIn과 같은 값 (초)
  expires-in-seconds: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
