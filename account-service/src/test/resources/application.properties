# 테스트 전용 JWT 키 (실제 키 아님). 표준 Base64, 디코딩 후 32바이트 이상. main의 application.yml과 합쳐서 읽힌다
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTAxMjM0NTY3ODlhYg==

# 테스트에서는 Outbox 발행기 스케줄을 끈다 (발행 테스트는 발행 메서드를 직접 호출)
outbox.publisher.enabled=false

# 테스트에서는 Kafka 리스너를 시작하지 않는다. 로컬 Kafka(localhost:29092)가 떠 있으면 같은 group-id로 실제 메시지를 가져가기 때문
# Consumer 통합 테스트는 spring.kafka.listener.auto-startup=true와 Testcontainers Kafka 주소를 직접 지정한다
spring.kafka.listener.auto-startup=false

# 첫 관리자 시드를 끈다. 로컬 .env에 ADMIN_LOGIN_ID가 있어도 테스트 DB에 관리자를 만들지 않게 한다 (시드 테스트는 값을 직접 지정)
admin-seed.login-id=
admin-seed.password=

# 테스트에서는 원장 대사 스케줄을 비활성화한다 (대사 테스트는 대사 메서드를 직접 호출)
ledger.reconciliation.enabled=false
