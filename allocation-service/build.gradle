dependencies {
	implementation project(':common')

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus 수집용 지표 (/actuator/prometheus)
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	runtimeOnly 'org.postgresql:postgresql'

	// 청약 서비스 확정 목록 조회 (D-08 A). Timeout, Circuit Breaker는 이 서비스에서 설정
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

	// contextLoads 등 DB 없이 띄우는 테스트용
	testRuntimeOnly 'com.h2database:h2'

	// ON CONFLICT 등 PostgreSQL 동작 검증용. 실행 시 Docker 필요 (버전은 Boot BOM 기준)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'

	// Kafka를 거치는 Consumer 통합 테스트용 (재시도, DLT). 실행 시 Docker 필요
	testImplementation 'org.testcontainers:kafka'
}
