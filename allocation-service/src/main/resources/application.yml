server:
  port: 8083

spring:
  application:
    name: allocation-service
  config:
    # 레포 루트의 .env를 읽는다 (docker-compose와 같은 파일). 실행 위치가 루트면 ./.env, 모듈이면 ../.env. 없으면 건너뛴다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # database ipo 하나에 서비스별 스키마 (allocation). 다른 서비스 스키마는 직접 조회하지 않는다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipo}?currentSchema=allocation
    # 서비스별 전용 계정 (init.sh가 만든다). 자기 스키마만 쓸 수 있다
    username: allocation_app
    password: ${ALLOCATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.default_schema: allocation
      # 스키마는 init.sh가 만든다 (같은 이름). 서비스 계정은 DB CREATE 권한이 없어서 이 설정은 동작하지 않아도 된다
      hibernate.hbm2ddl.create_namespaces: true
    # Hibernate가 테이블을 만든 뒤 schema.sql 실행
    defer-datasource-initialization: true
  sql:
    init:
      # schema.sql(제약, 부분 인덱스)을 기동할 때마다 실행한다. 여러 번 실행해도 된다
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # 이벤트 명세 공통 규칙: acks=all, enable.idempotence=true
      acks: all
      properties:
        enable.idempotence: true
        # Kafka가 죽었을 때 send()가 메타데이터를 기다리며 막히는 시간 (기본 60초). 발행 행마다 막히지 않게 send-timeout과 맞춘다
        max.block.ms: 5000
        # Producer가 포기하는 시간(delivery.timeout.ms)을 발행기의 send-timeout 이하로 맞춘다. 발행기가 실패로 처리한 뒤에도 Producer가 재시도해서 중복이 쌓이지 않게 한다
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
  cloud:
    openfeign:
      client:
        config:
          # 청약 확정 목록 조회 (API 명세 4.1). 재시도는 common 기본값 (5xx, 타임아웃 최대 2회)
          # 사용자가 기다리는 호출이 아니고 응답이 최대 500건이라 읽기는 여유 있게 둔다. 부하 테스트에서 응답 시간을 보고 조정
          subscription-service:
            connect-timeout: 1000
            read-timeout: 5000

# Outbox 발행기 (서비스 3개가 같은 키)
outbox:
  publisher:
    # false면 스케줄 실행을 끈다
    enabled: true
    # 이전 실행이 끝난 뒤 다시 실행하기까지 쉬는 시간 (ISO-8601, @Scheduled가 읽는다)
    interval: PT1S
    batch-size: 100
    # 이 횟수 이상 연속 실패하면 알림 로그. Consumer 재시도(3회)와 별개이고, 넘어도 발행은 계속 시도한다
    alert-threshold: 5
    send-timeout: 5s

# 청약 서비스 호출 Circuit Breaker (SubscriptionClientAdapter가 페이지 호출마다 감싼다)
# 호출이 공모주당 몇 번뿐이라 판단 범위, 최소 호출 수를 기본값(100)보다 작게 둔다. 기본값이면 Circuit Breaker가 열리지 않는다
resilience4j:
  circuitbreaker:
    instances:
      subscription-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # 4xx(공모주 없음, 아직 CLOSED 아님)는 청약 서비스가 정상 응답한 것이라 실패로 세지 않는다
        ignore-exceptions:
          - com.gongmoju.common.feign.FeignClientException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
