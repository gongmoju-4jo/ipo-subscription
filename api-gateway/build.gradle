dependencies {
	// 헬스체크(컨테이너), Prometheus 수집용 지표. 외부에는 열지 않고 관리 포트의 health, prometheus만 연다
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// 서비스별 API 문서를 모아 보는 통합 Swagger UI (WebFlux용)
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.17'

	// JWT 검증 (HS256, Nimbus). WebFlux 보안 필터 체인 (버전은 Boot BOM)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// 접속 대기열 상태 저장소 (WebFlux라 reactive 클라이언트)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	// 대기열 Redis 스크립트 테스트 (redis:7 컨테이너)
	testImplementation 'org.testcontainers:junit-jupiter'
}
