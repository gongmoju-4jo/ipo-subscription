// 서비스들이 공유하는 계약(BaseEntity, 공통 응답·예외 처리, Feign 공통 설정)만 둔다. 실행 앱이 아니라 라이브러리.
// 예외 처리·Feign 설정은 자동 설정(META-INF/spring/...AutoConfiguration.imports)으로 서비스에 등록된다.
apply plugin: 'java-library'

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    // 사용하는 서비스가 직접 가진 의존성을 쓰도록 compileOnly로만 둔다 (common이 서비스에 의존성을 끌고 가지 않게)
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Outbox 발행기 (CommonOutboxAutoConfiguration). 서비스가 직접 implementation으로 가지고 있어야 함
    compileOnly 'org.springframework.kafka:spring-kafka'
    // 스케줄러 중복 실행 방지 (CommonSchedulerLockAutoConfiguration). 쓰는 서비스가 같은 두 줄을 implementation으로 가지고 있어야 함
    // 6.x가 Spring 6.2(Boot 3.5) 기준 마지막 버전. 7.x는 Spring 7(Boot 4)용이라 쓰지 않는다
    compileOnly 'net.javacrumbs.shedlock:shedlock-spring:6.10.0'
    compileOnly 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.10.0'
    // 분산 추적 수집 제외 규칙 (CommonTracingAutoConfiguration). 서비스가 micrometer-tracing-bridge-brave를 implementation으로 가지고 있어야 함
    compileOnly 'io.micrometer:micrometer-tracing'
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.22'
    // CommonSwaggerAutoConfiguration (OpenAPI 모델). 버전은 서비스의 springdoc과 맞춤
    compileOnly 'org.springdoc:springdoc-openapi-starter-common:2.8.17'

    // Feign 재시도·에러 디코더 테스트용
    testImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'

    // RequestAuditorAware 테스트용 (요청 헤더, AuditorAware)
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.data:spring-data-commons'
    // CommonSwaggerAutoConfiguration 테스트용
    testImplementation 'org.springdoc:springdoc-openapi-starter-common:2.8.17'

    // Outbox 발행기 테스트용 (KafkaTemplate, JPA Repository 타입)
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 스케줄러 락 자동 설정 테스트용 (인스턴스 2개가 같은 PostgreSQL의 shedlock 표를 공유)
    testImplementation 'net.javacrumbs.shedlock:shedlock-spring:6.10.0'
    testImplementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.10.0'
    // 분산 추적 수집 제외 규칙, Outbox 추적 문맥 테스트용 (Brave로 실제 span, Kafka 헤더 확인)
    testImplementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // 자동 설정 DB 테스트용 (테스트 전용 앱 + PostgreSQL)
    testRuntimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
