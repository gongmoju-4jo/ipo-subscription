# 부하 테스트용 자원 고정. docker-compose.yml에 덮어써서 쓴다.
#   docker-compose -f docker-compose.yml -f compose.perf.yml up -d --build
# 컨테이너별 CPU, 메모리 상한과 JVM 힙을 고정해서 회차마다 같은 조건으로 측정한다.
# 아래 값은 Docker에 CPU 12개, 메모리 15GB가 할당된 PC 기준의 시작값이다. 머신에 맞게 고치고, 쓴 값은 측정 환경 기록에 적는다.
# 회원 시드(loadtest/seed)는 BCrypt 때문에 CPU를 많이 써서, 이 상한을 건 상태에서는 1,000명에 2분 넘게 걸린다. 시드는 상한 없이 먼저 하는 편이 빠르다.
# 한 번에 하나만 바꾼다: 메모리 상한을 바꿔도 힙이 같이 움직이지 않도록 JAVA_TOOL_OPTIONS로 힙을 따로 고정했다.
# GC도 G1로 명시했다. CPU 상한이 2 미만이면 JVM이 기본으로 SerialGC를 골라서, 상한을 바꿀 때 GC 방식까지 같이 바뀌기 때문이다.
#
# | 컨테이너 | CPU | 메모리 상한 | JVM 힙 |
# | api-gateway, account | 1.0 | 1g | 512m |
# | subscription-service | 2.0 | 1g | 512m |
# | allocation-service | 0.5 | 1g | 512m |
# | eureka-server | 0.5 | 512m | 192m |
# | postgres | 1.0 | 1g | - |
# | kafka | 1.0 | 1g | 512m |
# | prometheus, grafana | 0.5 | 512m | - |
#
# JVM은 CPU 상한을 보고 가용 프로세서 수(스레드 풀, GC 스레드)를 정한다. 상한을 바꾸면 그 영향도 같이 바뀐다.
# PostgreSQL은 pg_stat_statements와 슬로우 쿼리 로그(100ms 이상)를 켠다 (loadtest/sql/slow-queries.sql).
# kafka-ui는 측정 중 자원을 쓰지 않도록 기본 실행에서 뺀다 (필요하면 `docker-compose -f docker-compose.yml -f compose.perf.yml up -d kafka-ui`).
# 이 파일 없이 먼저 띄운 kafka-ui는 전환 후에도 계속 떠 있으니 `docker-compose stop kafka-ui`로 멈춘다.
services:
  postgres:
    cpus: 1.0
    mem_limit: 1g
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=100

  kafka:
    cpus: 1.0
    mem_limit: 1g
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

  kafka-ui:
    profiles: ["tools"]

  eureka-server:
    cpus: 0.5
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:+UseG1GC"

  api-gateway:
    cpus: 1.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"

  account-service:
    cpus: 1.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"

  subscription-service:
    cpus: 2.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"

  allocation-service:
    cpus: 0.5
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"

  prometheus:
    cpus: 0.5
    mem_limit: 512m

  grafana:
    cpus: 0.5
    mem_limit: 512m
