# 부하 테스트용 자원 고정. docker-compose.yml에 덮어써서 쓴다.
#   docker-compose -f docker-compose.yml -f compose.perf.yml up -d --build
# 컨테이너별 CPU, 메모리 상한과 JVM 힙을 고정해서 회차마다 같은 조건으로 측정한다.
# 아래 값은 Docker에 CPU 10개, 메모리 약 12GB가 할당된 PC(`docker info`의 CPUs, Total Memory) 기준이다. 머신에 맞게 고치고, 쓴 값은 측정 환경 기록에 적는다.
# 회원 시드(loadtest/seed)는 BCrypt 때문에 CPU를 많이 써서, 이 상한을 건 상태에서는 1,000명에 2분 넘게 걸린다. 시드는 상한 없이 먼저 하는 편이 빠르다.
# 한 번에 하나만 바꾼다: 메모리 상한을 바꿔도 힙이 같이 움직이지 않도록 JAVA_TOOL_OPTIONS로 힙을 따로 고정했다.
# GC도 G1로 명시했다. CPU 상한이 2 미만이면 JVM이 기본으로 SerialGC를 골라서, 상한을 바꿀 때 GC 방식까지 같이 바뀌기 때문이다.
#
# | 컨테이너 | CPU | 메모리 상한 | JVM 힙 |
# | api-gateway, account | 1.0 | 1g | 512m |
# | subscription-service | 2.0 | 1g | 512m |
# | allocation-service | 0.5 | 2g | 1536m |
# | eureka-server | 0.5 | 512m | 192m |
# | postgres | 2.0 | 1g | - |
# | kafka | 1.0 | 1g | 512m |
# | prometheus, grafana | 0.5 | 512m | - |
# | redis | 0.5 | 256m | - (`--maxmemory 200mb`) |
# | zipkin | 0.5 | 768m | 512m |
# | loki | 0.5 | 512m | - |
# | alloy | 0.25 | 256m | - |
#
# 분산 추적은 서비스 4개의 샘플링을 0으로 둬서 Zipkin으로 보내지 않는다 (span 생성, 전송 비용이 서비스 CPU 상한 안에서 측정값에 섞이지 않게).
# 계측 코드(관측 생성, 로그 traceId, Outbox 문맥 저장)는 그대로 돌아서 추적을 넣기 전 회차와 완전히 같은 조건은 아니다.
# 로그 수집(alloy, loki)은 샘플링과 관계없이 돈다. 서비스 상한 밖의 별도 컨테이너지만 PC 전체 CPU는 나눠 쓴다
#
# redis는 컨테이너 상한보다 작은 --maxmemory를 둔다. 상한에 먼저 닿으면 컨테이너가 강제 종료되어 대기열이 통째로 사라지고,
# --maxmemory에 먼저 닿으면 noeviction이라 쓰기만 오류가 나서 드러난다 (게이트웨이 알림 QueueAdmissionDown의 redis_oom).
# 입장 허가 키는 1개에 약 180바이트다 (redis:7, 10만 개 약 18MB 실측). 부하 테스트는 run-k6.sh가 끝나면 넣은 허가를 지운다
#
# JVM은 CPU 상한을 보고 가용 프로세서 수(스레드 풀, GC 스레드)를 정한다. 상한을 바꾸면 그 영향도 같이 바뀐다.
# PostgreSQL은 pg_stat_statements와 슬로우 쿼리 로그(100ms 이상)를 켠다 (loadtest/sql/slow-queries.sql).
# kafka-ui는 측정 중 자원을 쓰지 않도록 기본 실행에서 뺀다 (필요하면 `docker-compose -f docker-compose.yml -f compose.perf.yml up -d kafka-ui`).
# 이 파일 없이 먼저 띄운 kafka-ui는 전환 후에도 계속 떠 있으니 `docker-compose stop kafka-ui`로 멈춘다.
services:
  postgres:
    cpus: 2.0
    mem_limit: 1g
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=100

  kafka:
    cpus: 1.0
    mem_limit: 1g
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

  kafka-ui:
    profiles: ["tools"]

  eureka-server:
    cpus: 0.5
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:+UseG1GC"

  api-gateway:
    cpus: 1.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"
      # 추적은 보내지 않는다 (샘플링 0). 계측 코드는 그대로라 로그에는 traceId가 남는다
      # 원인 분석 때만 낮은 속도에서 TRACING_SAMPLING_PROBABILITY=1.0으로 띄운다 (.env 또는 명령 앞에 붙임)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0}

  account-service:
    cpus: 1.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"
      # 추적은 보내지 않는다 (샘플링 0). 계측 코드는 그대로라 로그에는 traceId가 남는다
      # 원인 분석 때만 낮은 속도에서 TRACING_SAMPLING_PROBABILITY=1.0으로 띄운다 (.env 또는 명령 앞에 붙임)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0}

  subscription-service:
    cpus: 2.0
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m -XX:+UseG1GC"
      # 추적은 보내지 않는다 (샘플링 0). 계측 코드는 그대로라 로그에는 traceId가 남는다
      # 원인 분석 때만 낮은 속도에서 TRACING_SAMPLING_PROBABILITY=1.0으로 띄운다 (.env 또는 명령 앞에 붙임)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0}

  allocation-service:
    cpus: 0.5
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1536m -Xmx1536m -XX:+UseG1GC"
      # 추적은 보내지 않는다 (샘플링 0). 계측 코드는 그대로라 로그에는 traceId가 남는다
      # 원인 분석 때만 낮은 속도에서 TRACING_SAMPLING_PROBABILITY=1.0으로 띄운다 (.env 또는 명령 앞에 붙임)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0}

  prometheus:
    cpus: 0.5
    mem_limit: 512m

  grafana:
    cpus: 0.5
    mem_limit: 512m

  zipkin:
    cpus: 0.5
    mem_limit: 768m

  loki:
    cpus: 0.5
    mem_limit: 512m

  alloy:
    cpus: 0.25
    mem_limit: 256m

  redis:
    cpus: 0.5
    mem_limit: 256m
    # docker-compose.yml의 command를 통째로 바꾸므로 noeviction, 영속화 끔도 다시 적는다
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
