# 배포 환경(EC2)용. docker-compose.yml, compose.perf.yml 위에 겹쳐 쓴다 (자원 상한, JVM 힙은 compose.perf.yml 값을 그대로 쓴다)
#   docker compose -f docker-compose.yml -f compose.perf.yml -f compose.prod.yml up -d
# ECR_REGISTRY, IMAGE_TAG는 배포 스크립트가 넣는다. 비어 있으면 실행하지 않는다
# 서비스 이미지는 서버에서 빌드하지 않고 ECR에서 받는다 (build를 지워 실수로 서버 빌드가 일어나지 않게 한다)
# 외부에 여는 포트는 web(Caddy) 하나(80, 443)뿐이다. 게이트웨이를 포함한 나머지는 docker-compose.yml대로 127.0.0.1에만 열린다
# web은 SITE_DOMAIN(Parameter Store)의 인증서를 Let's Encrypt에서 받고, 프론트 화면을 주고, /api와 Swagger를 게이트웨이로 넘긴다 (frontend/Caddyfile)
# 서버가 재부팅되거나 컨테이너가 죽으면 다시 띄운다 (kafka-init은 토픽을 만들고 끝나는 컨테이너라 제외)
# 분산 추적(zipkin), 로그 수집(loki, alloy)도 포함한다. Zipkin은 메모리 저장이라 배포로 컨테이너가 다시 만들어지면 trace가 사라진다 (로그는 볼륨에 남음)
# 배포 대기(deploy.sh)는 서비스 5개와 web의 healthy만 본다. zipkin, loki, alloy가 늦게 떠도 배포는 성공으로 본다
services:
  postgres:
    restart: unless-stopped

  kafka:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  eureka-server:
    build: !reset null
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/eureka-server:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    restart: unless-stopped

  api-gateway:
    build: !reset null
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/api-gateway:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    restart: unless-stopped
    environment:
      # compose.perf.yml이 부하 측정용으로 0으로 둔 샘플링을 배포 환경은 다시 전부(1.0)로 돌린다 (요청이 적어 전부 봐도 부담 없음)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

  account-service:
    build: !reset null
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/account-service:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    restart: unless-stopped
    environment:
      # compose.perf.yml이 부하 측정용으로 0으로 둔 샘플링을 배포 환경은 다시 전부(1.0)로 돌린다 (요청이 적어 전부 봐도 부담 없음)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

  subscription-service:
    build: !reset null
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/subscription-service:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    restart: unless-stopped
    environment:
      # compose.perf.yml이 부하 측정용으로 0으로 둔 샘플링을 배포 환경은 다시 전부(1.0)로 돌린다 (요청이 적어 전부 봐도 부담 없음)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

  allocation-service:
    build: !reset null
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/allocation-service:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    restart: unless-stopped
    environment:
      # compose.perf.yml이 부하 측정용으로 0으로 둔 샘플링을 배포 환경은 다시 전부(1.0)로 돌린다 (요청이 적어 전부 봐도 부담 없음)
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  zipkin:
    restart: unless-stopped

  loki:
    restart: unless-stopped

  alloy:
    restart: unless-stopped

  # 외부 공개 지점. 이미지는 frontend/Dockerfile (프론트 빌드 결과 + Caddy)
  # 게이트웨이를 먼저 다시 만든 뒤 띄운다. 이전 배포의 게이트웨이가 80을 쥐고 있으면 web이 80을 열지 못한다
  # 인증서는 caddy-data 볼륨에 남는다. 지우면 다시 발급받아야 하고, 같은 도메인은 7일에 5번까지만 발급된다 (Let's Encrypt)
  web:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 비어 있습니다}/ipo/web:${IMAGE_TAG:?IMAGE_TAG가 비어 있습니다}
    container_name: ipo-web
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN이 비어 있습니다}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cpus: 0.5
    mem_limit: 256m
    # Caddy 관리 API(컨테이너 안 2019번)가 응답하면 설정을 읽고 떠 있는 것이다. 인증서 발급 성공 여부와는 별개다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
