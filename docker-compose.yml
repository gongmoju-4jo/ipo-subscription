# 최소 구성: PostgreSQL만. Kafka, 서비스 컨테이너, 모니터링은 이어서 추가한다
# 실행: docker-compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: ipo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ipo}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 서비스별 스키마(account, subscription, allocation) 생성
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
