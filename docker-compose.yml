# 인프라(PostgreSQL, Kafka, Redis), 서비스 컨테이너 5개, 모니터링(Prometheus, Grafana)
# 개발할 때: 인프라만 띄우고 서비스는 IntelliJ로 실행한다 (docker-compose up -d postgres kafka kafka-init kafka-ui redis)
# 전체 확인할 때: jar를 먼저 빌드하고 전부 띄운다 (./gradlew build -x test && docker-compose up -d --build)
# 같은 서비스를 Docker와 IntelliJ에서 동시에 띄우지 않는다 (포트 충돌, Eureka 중복 등록)
services:
  postgres:
    image: postgres:16
    container_name: ipo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ipo}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      # 관리자(슈퍼유저) 비밀번호. 기본값 없음: .env에 직접 정한 값을 넣는다. 비어 있으면 DB를 만들기 전에 종료한다
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      # 서비스별 계정 비밀번호 (init.sh가 계정을 만들 때 쓴다). 기본값 없음: .env에 직접 정한 값을 넣는다. 비어 있으면 DB를 만들기 전에 종료한다
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-}
      ALLOCATION_DB_PASSWORD: ${ALLOCATION_DB_PASSWORD:-}
      TZ: Asia/Seoul
    # 기본 진입점을 감싸서 DB를 처음 만들기 전에 비밀번호를 검사한다 (docker/postgres/entrypoint.sh)
    entrypoint: ["/bin/bash", "/docker-entrypoint-wrapper.sh"]
    command: ["postgres"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/entrypoint.sh:/docker-entrypoint-wrapper.sh:ro
      # 서비스별 스키마(account, subscription, allocation) 생성
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft 단일 브로커. 호스트(IDE 앱)는 localhost:29092, 컨테이너는 kafka:29092로 접속한다
  kafka:
    image: apache/kafka:4.3.1
    container_name: ipo-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 컨테이너 안에서 INTERNAL은 29092, HOST는 9094로 열고 호스트에는 HOST만 29092로 노출한다 (포트 충돌 방지)
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9094,CONTROLLER://:9093
      # 호스트 포트를 바꾸면 HOST 광고 주소도 같이 바뀌어야 연결 후 메타데이터 응답에서 끊기지 않는다
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 이미지 기본 저장 경로는 /tmp라서 볼륨이 쓰이지 않는다. 볼륨 경로로 지정해야 재생성 후에도 데이터가 남는다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 토픽은 kafka-init이 만든다. 없는 토픽으로 발행해도 자동 생성되지 않게 끈다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 단일 브로커라 내부 토픽 복제 수는 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 토픽을 만들고 종료하는 일회성 컨테이너. 토픽 목록, 파티션 수(기본 6)는 docker/kafka/create-topics.sh
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: ipo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-}
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro

  # 토픽, 컨슈머 그룹 확인용 웹 UI: http://localhost:8989 (KAFKA_UI_PORT로 변경 가능)
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: ipo-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8989}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # 접속 대기열 상태 저장소 (api-gateway만 쓴다). 호스트(IntelliJ로 띄운 게이트웨이)는 localhost:6379(REDIS_PORT로 변경 가능), 컨테이너는 redis:6379로 접속한다
  # 메모리가 차도 키를 지우지 않는다(noeviction). 지우면 대기 중인 사람이 조용히 사라지고, 차면 쓰기가 오류로 드러난다
  # 디스크에 저장하지 않는다(RDB, AOF 끔). 대기열은 화면용 임시 상태라 재시작하면 비고, 투자자는 다시 진입한다 (청약, 돈 데이터와 무관)
  redis:
    image: redis:7
    container_name: ipo-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== 서비스 컨테이너 =====
  # 실행 전에 jar를 빌드해야 한다: ./gradlew build -x test (Dockerfile이 {모듈}/build/libs/*.jar를 복사한다)
  # 서비스 컨테이너 중 호스트에 여는 포트는 api-gateway(8080)와 eureka-server 대시보드(8761)만이다. 둘 다 127.0.0.1에만 바인딩한다
  # 서비스(8081~8083)는 토큰 없이 X-User-Id 헤더만으로 호출되므로 열지 않는다
  # 앱은 .env 파일을 컨테이너 안에서 읽지 못하므로 필요한 값을 환경변수로 받는다 (값은 docker-compose가 .env에서 읽어 전달한다)
  # 대시보드: http://localhost:8761 (EUREKA_PORT로 변경 가능. Windows 예약 포트에 걸리면 .env에서 바꾼다)
  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    container_name: ipo-eureka-server
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # 호스트 포트는 127.0.0.1에만 연다. 관리 포트(18090)는 헬스체크 전용이라 열지 않는다
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    container_name: ipo-api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      # account-service와 같은 값이어야 한다. 비어 있거나 짧으면 기동할 때 실패한다
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_HOST: redis
      # 대기열 입장 속도, 허가 유효 시간. 대기열 효과 측정 때만 .env에서 바꾼다 (.env.example). 기본값은 application.yml과 같게 둔다 (빈 값을 넘기면 기동에 실패한다)
      QUEUE_ADMIT_RATE: ${QUEUE_ADMIT_RATE:-433}
      QUEUE_ADMISSION_TTL: ${QUEUE_ADMISSION_TTL:-PT5M}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    container_name: ipo-account-service
    environment:
      DB_HOST: postgres
      # postgres가 만드는 DB 이름과 같아야 한다 (.env의 DB_NAME을 바꿨을 때도 맞도록 같은 값을 전달한다)
      DB_NAME: ${DB_NAME:-ipo}
      # 자기 계정의 비밀번호만 전달한다 (관리자 DB_PASSWORD는 전달하지 않는다)
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  subscription-service:
    build:
      context: .
      args:
        MODULE: subscription-service
    container_name: ipo-subscription-service
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-ipo}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  allocation-service:
    build:
      context: .
      args:
        MODULE: allocation-service
    container_name: ipo-allocation-service
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-ipo}
      ALLOCATION_DB_PASSWORD: ${ALLOCATION_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ===== 모니터링 =====
  # 시스템 전체에 하나씩. Prometheus가 서비스 5개의 /actuator/prometheus를 5초마다 가져가고(docker/prometheus/prometheus.yml),
  # Grafana가 그 Prometheus 하나를 데이터 소스로 쓴다 (docker/grafana/provisioning). 둘 다 127.0.0.1에만 연다
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ipo-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 대시보드: http://localhost:3000 (GRAFANA_PORT로 변경 가능). 관리자 계정은 admin, 비밀번호는 .env의 GRAFANA_ADMIN_PASSWORD
  grafana:
    image: grafana/grafana:12.1.0
    container_name: ipo-grafana
    # 기본 진입점을 감싸서 관리자 비밀번호가 비어 있으면 시작 전에 막는다 (docker/grafana/entrypoint.sh)
    entrypoint: ["/bin/sh", "/docker-entrypoint-wrapper.sh"]
    environment:
      # 기본값 없음: .env에 직접 정한 값을 넣는다. 비어 있으면 시작하지 않는다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Seoul
      # Slack 장애 알림 (docker/grafana/provisioning/alerting). URL이 비어 있으면 알림이 나가지 않는다
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_ENV: ${ALERT_ENV:-local}
      # Slack 메시지 안 Grafana 링크의 주소
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/entrypoint.sh:/docker-entrypoint-wrapper.sh:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
