# 최소 구성: PostgreSQL만. Kafka, 서비스 컨테이너, 모니터링은 이어서 추가한다
# 실행: docker-compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: ipo-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 서비스별 DB(account_db, subscription_db, allocation_db) 생성
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft 단일 브로커. 호스트(IDE 앱)는 localhost:29092, 컨테이너는 kafka:29092로 접속한다
  kafka:
    image: apache/kafka:4.3.1
    container_name: ipo-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 컨테이너 안에서 INTERNAL은 29092, HOST는 9094로 열고 호스트에는 HOST만 29092로 노출한다 (포트 충돌 방지)
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9094,CONTROLLER://:9093
      # 호스트 포트를 바꾸면 HOST 광고 주소도 같이 바뀌어야 연결 후 메타데이터 응답에서 끊기지 않는다
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 이미지 기본 저장 경로는 /tmp라서 볼륨이 쓰이지 않는다. 볼륨 경로로 지정해야 재생성 후에도 데이터가 남는다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 단일 브로커라 내부 토픽 복제 수는 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Seoul
    ports:
      - "${KAFKA_PORT:-29092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 토픽, 컨슈머 그룹 확인용 웹 UI: http://localhost:8989 (KAFKA_UI_PORT로 변경 가능)
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: ipo-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      TZ: Asia/Seoul
    ports:
      - "${KAFKA_UI_PORT:-8989}:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
