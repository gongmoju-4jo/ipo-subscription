# Slack 장애 알림 연락처. URL과 환경 이름은 Grafana 기동 시 환경변수로 채운다 (docker-compose.yml의 grafana environment)
# - SLACK_WEBHOOK_URL: 비어 있으면 알림이 나가지 않는다. 실제 장애대응 채널 URL은 배포 환경에만 넣는다
# - ALERT_ENV: 메시지 제목 앞에 붙는 환경 이름 (local, prod). 메시지 틀(templates.yml)에서는 환경변수를 읽을 수 없어 여기서 붙인다
# - 두 연락처는 같은 채널, 같은 메시지 틀(templates.yml)을 쓰고 복구 메시지를 보내는지만 다르다
apiVersion: 1
contactPoints:
  # 상태 알림(서비스 다운, 5xx 비율 등): 조건이 풀리면 복구 메시지를 보낸다
  - orgId: 1
    name: slack-incident
    receivers:
      - uid: slack-incident
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '[${ALERT_ENV}] {{ template "incident.title" . }}'
          text: '{{ template "incident.text" . }}'
  # 사건 알림(DLT 적재, ERROR 로그): "새로 생겼다"를 알리는 것이라 복구 메시지를 보내지 않는다
  # 조건이 풀리는 것은 5분 동안 새로 생기지 않았다는 뜻일 뿐이고, 쌓인 DLT나 ERROR 원인은 그대로 남아 있다
  - orgId: 1
    name: slack-incident-event
    receivers:
      - uid: slack-incident-event
        type: slack
        disableResolveMessage: true
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '[${ALERT_ENV}] {{ template "incident.title" . }}'
          text: '{{ template "incident.text" . }}'
