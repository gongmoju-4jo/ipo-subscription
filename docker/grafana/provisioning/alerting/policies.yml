# 알림을 Slack 연락처로 보낸다. 기본은 slack-incident, DLT 적재와 ERROR 로그만 복구 메시지가 없는 slack-incident-event
# - group_by: 같은 규칙, 같은 서비스, 같은 사유의 알림은 한 메시지로 묶는다
#   reason은 QueueAdmissionDown의 실패 사유 라벨이다. 빼면 사유가 다른 알림이 한 묶음이 되어, 새 사유의 장애 메시지에
#   이미 해제된 다른 사유가 "복구된 장애"로 섞여 나온다. 다른 규칙에는 reason 라벨이 없어 영향이 없다
# - group_wait: 처음 발생한 뒤 30초 동안 같은 묶음의 알림을 모아 한 번에 보낸다
# - group_interval: 이미 보낸 묶음에 바뀐 것(새 알림, 복구)이 있으면 1분 간격으로 보낸다 (복구 메시지가 늦어도 1분 안에 나가게)
# - repeat_interval: 복구되지 않으면 1시간마다 다시 보낸다
# 하위 경로는 group_by 외의 값(group_wait 등)을 위에서 물려받는다
apiVersion: 1
policies:
  - orgId: 1
    receiver: slack-incident
    group_by: ['grafana_folder', 'alertname', 'job', 'reason']
    group_wait: 30s
    group_interval: 1m
    repeat_interval: 1h
    routes:
      # DLT 적재, ERROR 로그 (rules.yml). topic은 DLT 토픽 라벨이다. 빼면 같은 서비스의 다른 DLT 토픽이 한 메시지로 묶인다
      - receiver: slack-incident-event
        object_matchers:
          - ['alertname', '=~', 'DltMessageArrived|ErrorLogDetected']
        group_by: ['grafana_folder', 'alertname', 'job', 'topic']
