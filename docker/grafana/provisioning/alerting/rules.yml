# 장애 알림 규칙. 30초마다 평가하고, 조건이 "for" 동안 계속 참이면 Slack으로 보낸다 (policies.yml)
# 기준값 근거: 정식 부하 측정(S1 600건/초까지)에서
# - HikariCP 대기는 최대 17개였지만 1개 이상 대기가 이어진 최장 시간은 약 25초 → 1분 지속이면 부하 측정으로는 울리지 않는다
# - 힙 사용률 최대는 76% (subscription-service), 90% 초과는 없었다
# 템플릿의 $labels, $values는 Grafana 알림 템플릿 변수다 (이 파일은 환경변수 치환을 하지 않아 $를 그대로 적는다)
apiVersion: 1
groups:
  - orgId: 1
    name: ipo-incident
    folder: 장애 알림
    interval: 30s
    rules:
      # 서비스 다운: Prometheus가 서비스의 /actuator/prometheus 수집에 실패하면 up이 0이 된다
      - uid: ipo-service-down
        title: ServiceDown
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: '{{ $labels.job }} 지표 수집 1분 넘게 실패 (컨테이너 종료 또는 응답 없음)'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 5xx 비율: 서비스별 전체 요청(헬스체크, 지표 수집 제외) 중 5xx 비율. 5xx가 없으면 결과가 없어 정상으로 본다
      - uid: ipo-http-5xx-rate
        title: HttpServerErrorRateHigh
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.job }} 5xx 응답 비율 2분 넘게 5% 초과 (현재 {{ humanizePercentage $values.A.Value }})'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum by (job) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[1m]))
                / sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # DB 커넥션 대기: 풀(기본 10개)이 모두 사용 중이라 커넥션을 기다리는 요청 수
      - uid: ipo-hikari-pending
        title: HikariConnectionPending
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.job }} DB 커넥션 대기 1분 넘게 지속 (현재 {{ $values.A.Value }}개 대기)'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (job) (hikaricp_connections_pending)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 힙 사용률: G1의 Eden, Survivor는 최대값이 -1이라 0보다 큰 최대값만 더한다 (= 최대 힙)
      - uid: ipo-jvm-heap-high
        title: JvmHeapUsageHigh
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.job }} 힙 사용률 5분 넘게 90% 초과 (현재 {{ humanizePercentage $values.A.Value }})'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum by (job) (jvm_memory_used_bytes{area="heap"})
                / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }

      # 대기열 입장 처리: 게이트웨이 입장 스케줄러가 1초마다 Redis로 입장 처리를 하고(대기자가 없어도 Redis를 조회), 실패하면 그 사유(reason)의 값만 1로 내보낸다.
      # 실패가 이어지면 아무도 입장 허가를 받지 못해 모든 청약 신청이 막힌다. 요청이 없는 시간의 Redis 장애는 5xx 비율로 잡히지 않아 따로 본다.
      # 사유는 api-gateway AdmissionFailureReason이 정한다 (redis_oom, redis_timeout, redis_connection, redis_error, other). 사유마다 따로 알림이 뜬다.
      # Redis 컨테이너가 멈추면 연결이 끊긴 채 응답을 기다리다 시간 초과로 끝나서 redis_timeout으로 온다 ("느림"과 "멈춤"은 구분되지 않는다)
      # 게이트웨이가 내려가 지표가 없으면 ServiceDown이 잡으므로 결과가 없으면 정상으로 본다
      - uid: ipo-queue-admission-down
        title: QueueAdmissionDown
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            {{ $labels.job }} 대기열 입장 처리 1분 넘게 실패:
            {{ if eq $labels.reason "redis_timeout" }}Redis 응답 없음 (연결 끊김 또는 응답 지연으로 시간 초과). redis 컨테이너가 떠 있는지, 느린 명령이 있는지 확인
            {{- else if eq $labels.reason "redis_connection" }}Redis 연결 실패 (연결 거부 또는 주소를 찾을 수 없음). redis 컨테이너와 REDIS_HOST, REDIS_PORT 확인
            {{- else if eq $labels.reason "redis_oom" }}Redis 메모리 상한 도달 (쓰기 거부). Redis 메모리 사용량과 maxmemory 확인
            {{- else if eq $labels.reason "redis_error" }}Redis 오류 (키 자료형 불일치, 스크립트 오류 등). 게이트웨이 로그의 "대기열 입장 처리 실패" 확인
            {{- else }}게이트웨이 내부 오류 (Redis 외 원인). 게이트웨이 로그의 "대기열 입장 처리 실패" 확인{{ end }}.
            입장 허가가 나가지 않아 청약 신청이 막힘
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (job, reason) (queue_admission_failing)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 아래 두 규칙은 "새로 생겼다"는 사건 알림이다. 바로 보내고(for 0s), 복구 메시지는 보내지 않는다 (policies.yml → slack-incident-event)
      # - 새로 생긴 건수 = 지금 누적값 - 5분 전까지 마지막으로 수집한 누적값. 5분 동안 새로 생기지 않으면 조건이 풀리고, 그 뒤 다시 생기면 새 알림이 간다
      # - 5분 전 값은 1시간 안의 마지막 값을 쓴다 (last_over_time). 수집이 끊겼다 이어져도(Prometheus 재시작, 수집 실패) 공백 전 값과 비교해서,
      #   이미 알린 누적값을 다시 알리지 않고 공백 중에 실제로 생긴 건만 알린다
      # - 카운터는 서비스가 다시 뜨면 0부터 세는데 시계열 라벨은 같다. 그래서 그 마지막 값이 지금 프로세스가 뜬 뒤에 수집된 것일 때만 빼고
      #   (마지막 수집 시각 > process_start_time_seconds), 아니면(재시작 전 값, 처음 생긴 시계열) 0으로 보고 지금 누적값 전체를 알린다
      # - 1시간 넘게 수집하지 못한 서비스는 비교할 값이 없다. 그사이 다시 떴으면(1시간 5분 안에 시작) 전체를 알리고,
      #   그보다 오래 떠 있던 서비스는 공백 중 생긴 건을 알 수 없어 알리지 않는다
      # - 알림에 실패 원인은 없다. DLT는 Kafka-UI에서 메시지 헤더, ERROR는 해당 서비스 로그로 확인한다

      # DLT 적재: Consumer가 재시도 끝에 처리하지 못한 메시지를 {토픽}.DLT로 보낸 건수 (서비스, DLT 토픽별)
      # 토픽별 전송 지표는 그 토픽에 처음 보낸 뒤에 생기고, 생길 때 이미 1 이상이다
      - uid: ipo-dlt-message-arrived
        title: DltMessageArrived
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.topic }}에 새 메시지 {{ $values.A.Value }}건 (최근 5분). Kafka-UI에서 메시지 헤더의 실패 원인 확인'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (
                  (
                    sum by (job, topic) (kafka_producer_topic_record_send_total{topic=~".+[.]DLT"})
                    - on (job, topic) (
                      sum by (job, topic) (last_over_time(kafka_producer_topic_record_send_total{topic=~".+[.]DLT"}[1h] offset 5m))
                      and on (job, topic) (max by (job, topic) (max_over_time(timestamp(kafka_producer_topic_record_send_total{topic=~".+[.]DLT"})[1h:15s] offset 5m)) > on (job) group_left max by (job) (process_start_time_seconds))
                      or
                      sum by (job, topic) (kafka_producer_topic_record_send_total{topic=~".+[.]DLT"}) * 0
                    )
                  )
                  and on (job) (
                    max by (job) (process_start_time_seconds) == on (job) max by (job) (last_over_time(process_start_time_seconds[1h] offset 5m))
                    or
                    max by (job) (process_start_time_seconds) > time() - 3900
                  )
                ) > 0
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # ERROR 로그: 서비스별 ERROR 로그 건수 (서비스 코드 외 Kafka 클라이언트, Eureka 등 라이브러리 로거 포함)
      # 이 지표는 기동할 때 0으로 생긴다. 기동 중 ERROR는 재시작 조건으로 잡고, 정상 기동은 0이라 울리지 않는다
      - uid: ipo-error-log-detected
        title: ErrorLogDetected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'ERROR 로그 {{ $values.A.Value }}건 (최근 5분). 해당 서비스 로그 확인'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (
                  (
                    sum by (job) (logback_events_total{level="error"})
                    - on (job) (
                      sum by (job) (last_over_time(logback_events_total{level="error"}[1h] offset 5m))
                      and on (job) (max by (job) (max_over_time(timestamp(logback_events_total{level="error"})[1h:15s] offset 5m)) > on (job) group_left max by (job) (process_start_time_seconds))
                      or
                      sum by (job) (logback_events_total{level="error"}) * 0
                    )
                  )
                  and on (job) (
                    max by (job) (process_start_time_seconds) == on (job) max by (job) (last_over_time(process_start_time_seconds[1h] offset 5m))
                    or
                    max by (job) (process_start_time_seconds) > time() - 3900
                  )
                ) > 0
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
