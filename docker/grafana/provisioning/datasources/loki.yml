apiVersion: 1
datasources:
  # 컨테이너 로그 (Alloy가 모은다). Explore에서 {service="account-service"}처럼 조회한다
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # 로그 줄의 [traceId-spanId]에서 traceId를 뽑아 Zipkin trace로 가는 링크를 단다
      # Grafana가 파일 안의 $를 환경변수로 바꾸므로 $$로 적는다
      derivedFields:
        - name: traceId
          matcherRegex: '\[([0-9a-f]{32})-[0-9a-f]{16}\]'
          datasourceUid: zipkin
          url: '$${__value.raw}'
          urlDisplayLabel: Zipkin에서 trace 보기
