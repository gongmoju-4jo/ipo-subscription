server:
  port: 8082
  tomcat:
    # Tomcat 스레드 지표(tomcat_threads_busy 등)를 내보내려면 필요하다
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 서비스별 응답 시간의 p95, p99를 Prometheus에서 계산할 수 있도록 구간(histogram)을 함께 내보낸다
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: subscription-service
  config:
    # 레포 루트의 .env를 읽는다 (docker-compose와 같은 파일). 실행 위치가 루트면 ./.env, 모듈이면 ../.env. 없으면 건너뛴다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # database ipo 하나에 서비스별 스키마 (subscription). 다른 서비스 스키마는 직접 조회하지 않는다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipo}?currentSchema=subscription
    # 서비스별 전용 계정 (init.sh가 만든다). 자기 스키마만 쓸 수 있다
    username: subscription_app
    password: ${SUBSCRIPTION_DB_PASSWORD}
    hikari:
      # 기본값 10은 HTTP 요청, 리스너 스레드(concurrency), 스케줄러가 함께 써서 부하 중 커넥션 대기가 생긴다
      # 리스너 concurrency를 바꾸면 같이 본다. minimum-idle을 정하지 않아 늘 이만큼 연결을 잡으므로 서비스 합계가 PostgreSQL max_connections(100)를 넘지 않게 한다
      maximum-pool-size: 30
  sql:
    init:
      # schema.sql(제약, 부분 인덱스), data.sql(공모주 시드)을 기동할 때마다 실행한다. 두 파일 모두 여러 번 실행해도 된다
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    # Hibernate가 테이블을 만든 뒤 schema.sql, data.sql 실행
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate.default_schema: subscription
      # 스키마는 init.sh가 만든다 (같은 이름). 서비스 계정은 DB CREATE 권한이 없어서 이 설정은 동작하지 않아도 된다
      hibernate.hbm2ddl.create_namespaces: true
  jackson:
    deserialization:
      # 소수(100.5)를 정수 필드(청약 수량 등)로 잘라서 받지 않고 400으로 응답한다
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all                         # Outbox 발행기는 브로커 저장 확인(acks=all) 뒤에만 발행 완료로 기록한다. 재전송 중복은 idempotence로 막는다
      properties:
        enable.idempotence: true
        max.block.ms: 5000              # 브로커가 없거나 느리면 오래 기다리지 않고 발행 실패로 처리한다 (메타데이터 대기 5초, 전송 전체 10초). Outbox 발행기가 다음 주기에 다시 보낸다
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: subscription-requested  # 접수 Consumer 이름과 같은 값 (이벤트 명세 3-2)
      auto-offset-reset: earliest       # 그룹이 처음 생길 때 이미 202를 응답한 메시지를 놓치지 않도록 처음부터 읽음
      enable-auto-commit: false         # 처리가 끝난 레코드만 커밋함 (리스너 ack-mode: record)
    listener:
      ack-mode: record
      concurrency: 6                    # 토픽 파티션 수(docker/kafka/create-topics.sh 기본값 6)와 같은 수. 파티션보다 많으면 남는 Consumer는 일하지 않음

outbox:  # Outbox 발행기 (서비스 3개가 같은 키). Producer 설정(acks, 멱등, max.block.ms)은 위 spring.kafka.producer를 함께 쓴다
  publisher:
    enabled: true                 # false면 스케줄 실행을 끈다
    interval: PT1S                # 이전 실행이 끝난 뒤 다시 실행하기까지 쉬는 시간 (ISO-8601, @Scheduled가 읽는다)
    batch-size: 100
    alert-threshold: 5            # 이 횟수 이상 연속 실패하면 알림 로그. Consumer 재시도(3회)와 별개이고, 넘어도 발행은 계속 시도한다
    send-timeout: 10s             # Producer의 delivery.timeout.ms(10s) 이상으로 맞춘다. 발행기가 실패로 처리한 뒤 Producer가 재시도하지 않게 한다

ipo:
  close:  # 공모주 마감 스케줄러 (F-13, D-16)
    enabled: true         # false면 스케줄 실행을 끈다
    interval: PT5S        # 이전 실행이 끝난 뒤 다시 확인하기까지 쉬는 시간
    grace-period: PT20S   # 마감 시각 뒤 대기 시간. 마감 전에 받은 요청의 발행이 끝나기를 기다린다 (max.block.ms 5초 + delivery.timeout.ms 10초 + 여유)
    alert-after: PT5M     # 대기 시간 뒤 이 시간 동안 마감하지 못하면 ERROR 로그. 이후 같은 간격으로 반복하고, 강제로 마감하지는 않는다

saga:
  timeout:  # PENDING 응답 시간 초과 처리 (이벤트 명세 3-5, 4장 위험 4). 응답이 없는 PENDING은 인출을 재요청하고, 최대 횟수에 도달하면 COMPENSATING(TIMEOUT)으로 보상
    enabled: true            # false면 스케줄 실행을 끔
    interval: PT5S           # 이전 실행이 끝난 뒤 재확인까지 쉬는 시간 (Outbox 발행기와 같은 임시값, 부하 테스트 뒤 조정)
    response-timeout: PT30S  # 마지막 요청 시각에서 설정 시간이 지나면 응답이 없음으로 판정 (이벤트 명세에서 30초 확정. 같은 Consumer 재시도 합계 7초보다 길어야 함)
    max-attempts: 3          # 총 인출 요청 횟수. 접수 90초 뒤 시간 초과 보상 (임시값, 부하 테스트 뒤 조정)
    batch-size: 100          # 한 번에 처리하는 최대 건수 (오래된 순)
    alert-interval: PT5M     # 재요청 최대 횟수에 도달 시 ERROR 로그 기록 간격 (마감 스케줄러의 ipo.close.alert-after와 동일 값)

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
