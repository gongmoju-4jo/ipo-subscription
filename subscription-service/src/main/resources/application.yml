server:
  port: 8082

spring:
  application:
    name: subscription-service
  config:
    # 레포 루트의 .env를 읽는다 (docker-compose와 같은 파일). 실행 위치가 루트면 ./.env, 모듈이면 ../.env. 없으면 건너뛴다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # database ipo 하나에 서비스별 스키마 (subscription). 다른 서비스 스키마는 직접 조회하지 않는다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipo}?currentSchema=subscription
    # 서비스별 전용 계정 (init.sh가 만든다). 자기 스키마만 쓸 수 있다
    username: subscription_app
    password: ${SUBSCRIPTION_DB_PASSWORD}
  sql:
    init:
      # schema.sql(제약, 부분 인덱스), data.sql(공모주 시드)을 기동할 때마다 실행한다. 두 파일 모두 여러 번 실행해도 된다
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    # Hibernate가 테이블을 만든 뒤 schema.sql, data.sql 실행
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate.default_schema: subscription
      # 스키마는 init.sh가 만든다 (같은 이름). 서비스 계정은 DB CREATE 권한이 없어서 이 설정은 동작하지 않아도 된다
      hibernate.hbm2ddl.create_namespaces: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
