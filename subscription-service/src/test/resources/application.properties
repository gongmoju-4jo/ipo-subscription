# 테스트에서는 Outbox 발행기 스케줄을 끈다 (발행 테스트는 발행 메서드를 직접 호출)
outbox.publisher.enabled=false
# 테스트에서는 Kafka 리스너를 시작하지 않음. 로컬 개발 Kafka(localhost:29092)가 떠 있으면 같은 group-id로 실제 메시지를 가져가기 때문
# Consumer 통합 테스트는 spring.kafka.listener.auto-startup=true와 Testcontainers Kafka 주소를 직접 지정함
spring.kafka.listener.auto-startup=false
